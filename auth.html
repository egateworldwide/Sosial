<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sosial — returning to app…</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #F2EDE2; color: #1C1917;
         display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .card { background: #fff; border-radius: 16px; padding: 28px 32px; text-align: center; max-width: 320px;
          box-shadow: 0 4px 24px rgba(28,25,23,.08); }
  a { display: inline-block; margin-top: 14px; background: #C8500F; color: #fff; text-decoration: none;
      font-weight: 700; padding: 12px 28px; border-radius: 999px; }
</style>
</head>
<body>
<div class="card">
  <img src="bolt.png" alt="Sosial" width="72" style="display:block;margin:0 auto">
  <h2>Login complete</h2>
  <p>Returning to Sosial…</p>
  <a id="back" href="#">Open Sosial</a>
</div>
<script>
  // Meta appends ?code=… (or ?error=…) — forward everything, query + hash,
  // into the app's custom scheme so expo-web-browser can capture it.
  var q = location.search || '';
  var h = location.hash || '';
  var deep = 'sosial://redirect' + q + h;
  document.getElementById('back').href = deep;
  // auto-redirect; the manual button is the fallback if the browser blocks it
  setTimeout(function () { location.replace(deep); }, 300);
</script>
</body>
</html>
